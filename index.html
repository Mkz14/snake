<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Snake Neon</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top, #1f1f3d, #090909 70%);
  font-family: Arial;
  overflow:hidden;
  color:white;
}

/* CONTAINER JOGO */
.container{
  text-align:center;
}

/* TÍTULO */
h1{
  font-size:48px;
  color:#7CFF00;
  text-shadow:0 0 10px #7CFF00, 0 0 30px #7CFF00;
}

/* SCORE */
.score{
  font-size:22px;
  margin:10px;
}

/* CANVAS */
canvas{
  background:rgba(0,0,0,0.4);
  border:3px solid #7CFF00;
  border-radius:18px;
  box-shadow:0 0 20px #7CFF00;
}

/* BOTÕES */
button{
  padding:12px 20px;
  margin:8px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

/* TELAS */
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.85);
}

.hidden{
  display:none;
}

/* BOTÕES DIFICULDADE */
.easy{ background:#7CFF00; }
.medium{ background:#ffcc00; }
.hard{ background:#ff3b3b; color:white; }

.titleScreen h2{
  font-size:40px;
  margin-bottom:20px;
  color:#7CFF00;
  text-shadow:0 0 15px #7CFF00;
}

</style>
</head>

<body>

<!-- TELA INICIAL -->
<div class="screen titleScreen" id="startScreen">
  <h2>🐍 SNAKE NEON</h2>
  <p>Escolha a dificuldade:</p>

  <button class="easy" onclick="startGame(150)">FÁCIL</button>
  <button class="medium" onclick="startGame(90)">MÉDIO</button>
  <button class="hard" onclick="startGame(55)">DIFÍCIL</button>
</div>

<!-- GAME OVER -->
<div class="screen hidden" id="gameOver">
  <h2>GAME OVER</h2>
  <p>Pontuação: <span id="finalScore">0</span></p>
  <button class="easy" onclick="backToMenu()">Menu</button>
</div>

<!-- JOGO -->
<div class="container">
  <h1>🐍 SNAKE NEON</h1>
  <div class="score">Pontos: <span id="score">0</span></div>

  <canvas id="game" width="500" height="500"></canvas>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const finalScore = document.getElementById("finalScore");

const startScreen = document.getElementById("startScreen");
const gameOverScreen = document.getElementById("gameOver");

const size = 500;
const box = 25;

let snake, food, direction, score, game, speed;

function startGame(selectedSpeed){

  speed = selectedSpeed;

  snake = [{ x: 250, y: 250 }];
  direction = "RIGHT";
  score = 0;

  scoreEl.innerText = score;

  food = randomFood();

  startScreen.classList.add("hidden");
  gameOverScreen.classList.add("hidden");

  clearInterval(game);
  game = setInterval(draw, speed);
}

function randomFood(){
  return {
    x: Math.floor(Math.random() * 20) * box,
    y: Math.floor(Math.random() * 20) * box
  };
}

document.addEventListener("keydown", (e) => {

  if(e.key === "ArrowUp" && direction !== "DOWN") direction = "UP";
  if(e.key === "ArrowDown" && direction !== "UP") direction = "DOWN";
  if(e.key === "ArrowLeft" && direction !== "RIGHT") direction = "LEFT";
  if(e.key === "ArrowRight" && direction !== "LEFT") direction = "RIGHT";
});

function drawBackground(){
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(0,0,size,size);
}

function drawSnake(){
  snake.forEach((s,i)=>{

    ctx.fillStyle = i === 0 ? "#7CFF00" : "#bbff77";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#7CFF00";

    ctx.fillRect(s.x,s.y,box,box);
  });

  ctx.shadowBlur = 0;
}

function drawFood(){
  ctx.fillStyle = "#ff2e63";
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#ff2e63";

  ctx.beginPath();
  ctx.arc(food.x+box/2, food.y+box/2, box/2.3, 0, Math.PI*2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

function move(){

  let headX = snake[0].x;
  let headY = snake[0].y;

  if(direction==="UP") headY -= box;
  if(direction==="DOWN") headY += box;
  if(direction==="LEFT") headX -= box;
  if(direction==="RIGHT") headX += box;

  const newHead = {x: headX, y: headY};

  // colisão
  if(
    headX < 0 || headY < 0 ||
    headX >= size || headY >= size ||
    snake.some(p => p.x===headX && p.y===headY)
  ){
    endGame();
    return;
  }

  snake.unshift(newHead);

  if(headX === food.x && headY === food.y){
    score++;
    scoreEl.innerText = score;
    food = randomFood();
  } else {
    snake.pop();
  }
}

function draw(){
  drawBackground();
  drawFood();
  drawSnake();
  move();
}

function endGame(){
  clearInterval(game);
  finalScore.innerText = score;
  gameOverScreen.classList.remove("hidden");
}

function backToMenu(){
  gameOverScreen.classList.add("hidden");
  startScreen.classList.remove("hidden");
}

</script>

</body>
</html>
