<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Arcade Neon</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
  background:#020617;
}

/* =========================
   FUNDO
========================= */

canvas{
  position:fixed;
  inset:0;
  z-index:-3;
}

.bg-glow{
  position:fixed;
  inset:0;
  z-index:-2;

  background:
    radial-gradient(circle at top, rgba(0,180,255,.15), transparent 40%),
    radial-gradient(circle at bottom, rgba(0,90,255,.12), transparent 40%),
    #020617;
}

/* grade neon */
.grid{
  position:fixed;
  inset:0;
  z-index:-1;

  background-image:
    linear-gradient(rgba(0,180,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,180,255,.05) 1px, transparent 1px);

  background-size:40px 40px;

  transform:perspective(500px) rotateX(75deg) scale(2);

  animation:gridMove 12s linear infinite;
}

@keyframes gridMove{
  from{
    transform:perspective(500px) rotateX(75deg)
    translateY(0px) scale(2);
  }

  to{
    transform:perspective(500px) rotateX(75deg)
    translateY(40px) scale(2);
  }
}

/* =========================
   TITULO
========================= */

.title{
  position:absolute;
  top:35px;
  width:100%;

  text-align:center;

  font-size:90px;
  font-weight:900;
  letter-spacing:12px;

  color:#7ee7ff;

  text-shadow:
    0 0 5px #00d9ff,
    0 0 10px #00d9ff,
    0 0 20px #00cfff,
    0 0 40px #0099ff,
    0 0 80px #0066ff;

  animation:neonFlicker 2s infinite alternate;
}

@keyframes neonFlicker{

  0%{
    opacity:1;
  }

  2%{
    opacity:.8;
  }

  4%{
    opacity:1;
  }

  100%{
    text-shadow:
      0 0 10px #33e6ff,
      0 0 20px #33e6ff,
      0 0 40px #00cfff,
      0 0 80px #0099ff,
      0 0 120px #0066ff;
  }
}

/* =========================
   MENU
========================= */

.menu{
  width:100%;
  height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:50px;
}

/* =========================
   BOTÕES
========================= */

.game-btn{
  position:relative;

  width:220px;
  height:220px;

  border:none;
  border-radius:28px;

  overflow:hidden;

  cursor:pointer;

  background:#07111f;

  transition:.35s ease;

  border:2px solid rgba(0,191,255,.6);

  box-shadow:
    0 0 15px rgba(0,191,255,.4),
    inset 0 0 20px rgba(0,191,255,.15);

  backdrop-filter:blur(10px);
}

/* borda animada */
.game-btn::before{

  content:"";

  position:absolute;
  inset:-2px;

  border-radius:30px;

  background:linear-gradient(
    45deg,
    #00d9ff,
    #0088ff,
    #00d9ff
  );

  background-size:300% 300%;

  animation:borderAnim 4s linear infinite;

  z-index:-1;
}

@keyframes borderAnim{

  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:300% 50%;
  }
}

/* imagem */
.game-btn img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:.35s ease;
}

/* hover */
.game-btn:hover{

  transform:
    translateY(-12px)
    scale(1.05);

  box-shadow:
    0 0 20px #00d9ff,
    0 0 40px #00bfff,
    0 0 80px #0088ff;
}

.game-btn:hover img{
  transform:scale(1.08);
}

/* brilho interno */
.game-btn::after{

  content:"";

  position:absolute;
  top:-120%;
  left:-40%;

  width:60%;
  height:300%;

  background:rgba(255,255,255,.18);

  transform:rotate(25deg);

  transition:.7s;
}

.game-btn:hover::after{
  left:140%;
}

/* =========================
   CREDITOS
========================= */

.creditos{
  position:absolute;

  right:25px;
  bottom:18px;

  color:#87e8ff;

  font-size:18px;
  letter-spacing:1px;

  text-shadow:
    0 0 5px #00bfff,
    0 0 10px #0088ff;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:900px){

  .menu{
    flex-direction:column;
    gap:30px;
  }

  .game-btn{
    width:180px;
    height:180px;
  }

  .title{
    font-size:55px;
  }
}

</style>
</head>

<body>

<!-- Fundo -->
<canvas id="canvas"></canvas>
<div class="bg-glow"></div>
<div class="grid"></div>

<!-- Título -->
<div class="title">
  ARCADE
</div>

<!-- Menu -->
<div class="menu">

  <!-- Pong -->
  <button class="game-btn"
  onclick="window.location.href='https://mkz14.github.io/pong/'">

    <img src="https://www.coolmathgames.com/sites/default/files/retro-ping-pong-game-icon.png">

  </button>

  <!-- Cubo -->
  <button class="game-btn"
  onclick="window.location.href='https://mkz14.github.io/cubo-3d/'">

    <img src="https://cj.ibxk.com.br/2023/03/29/29171504300066.png">

  </button>

  <!-- Torre -->
  <button class="game-btn"
  onclick="window.location.href='https://mkz14.github.io/torre-de-blocos/'">

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzh07FNS-8zgVZhh3as0tuHJPRW_rMvvqF-g&s">

  </button>

</div>

<!-- Créditos -->
<div class="creditos">
  criadores: josilton e mike
</div>

<script>

/* =========================
   PARTICULAS
========================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

const particles = [];

class Particle{

  constructor(){

    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;

    this.size = Math.random() * 2 + 1;

    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;

    this.color = `hsl(${190 + Math.random()*40},100%,60%)`;
  }

  update(){

    this.x += this.speedX;
    this.y += this.speedY;

    if(this.x < 0) this.x = canvas.width;
    if(this.x > canvas.width) this.x = 0;

    if(this.y < 0) this.y = canvas.height;
    if(this.y > canvas.height) this.y = 0;
  }

  draw(){

    ctx.beginPath();

    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);

    ctx.fillStyle = this.color;

    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;

    ctx.fill();
  }
}

/* quantidade */
for(let i = 0; i < 70; i++){
  particles.push(new Particle());
}

/* linhas */
function connect(){

  for(let a = 0; a < particles.length; a++){

    for(let b = a + 1; b < particles.length; b++){

      let dx = particles[a].x - particles[b].x;
      let dy = particles[a].y - particles[b].y;

      let dist = dx*dx + dy*dy;

      if(dist < 6000){

        ctx.beginPath();

        ctx.strokeStyle = "rgba(0,180,255,.08)";
        ctx.lineWidth = 1;

        ctx.moveTo(particles[a].x, particles[a].y);
        ctx.lineTo(particles[b].x, particles[b].y);

        ctx.stroke();
      }
    }
  }
}

function animate(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  particles.forEach(p => {

    p.update();
    p.draw();

  });

  connect();

  requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
